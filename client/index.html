<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake Match 3</title>
<link rel="stylesheet" href="/css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<div id="hud" hidden>
  <div id="left">
    <canvas id="minimap"></canvas>
    <div id="net">
      <b id="fps">--</b> fps · <b id="frameMs">--</b> <span data-i18n="hud.msPerFrame"></span>
      · <span data-i18n="hud.latency"></span> <b id="ping">--</b> ms
    </div>
    <div id="stat">
      <div class="row"><span id="myName">-</span><span id="myTrophy">🏆 0</span></div>
      <div class="row small">
        <span data-i18n="hud.remaining"></span> <b id="myLen">0</b>
        <span class="tip" data-i18n="hud.remainingTip"></span>
      </div>
      <div id="beads"></div>
    </div>
    <div id="daily">
      <div class="title" data-i18n="hud.daily"></div>
      <div id="dailyList"></div>
    </div>
  </div>

  <div id="banner" hidden></div>

  <div id="board">
    <div class="title" id="boardTitle"></div>
    <ol id="boardList"></ol>
  </div>

  <div id="corner">
    <div id="rules" class="rules">
      <div class="rHead" data-i18n="rules.head"></div>
      <div><b data-i18n="rules.goalK"></b><span data-i18n="rules.goalV"></span></div>
      <div><b data-i18n="rules.matchK"></b><span data-i18n-html="rules.matchV"></span></div>
      <div><b data-i18n="rules.bodyK"></b><span data-i18n="rules.bodyV"></span></div>
      <div><b data-i18n="rules.headK"></b><span data-i18n="rules.headV"></span></div>
      <div><b data-i18n="rules.selfK"></b><span data-i18n="rules.selfV"></span></div>
    </div>
    <div id="hint" class="hint">
      <span data-i18n-html="hint.move"></span><br>
      <span data-i18n-html="hint.misc"></span>
    </div>
  </div>

  <div id="toasts"></div>

  <div id="win" hidden>
    <div class="winCard">
      <div class="wTitle" data-i18n="win.title"></div>
      <div class="wBy">
        <span data-i18n="win.gainPre"></span><b id="wGain">1</b>
        <span data-i18n="win.trophyPre"></span> <b id="wTrophy">0</b>
        <span data-i18n="win.trophyPost"></span>
      </div>
      <div class="wStreak" id="wStreak"></div>
      <div class="wCd">
        <span data-i18n="win.cdPre"></span> <b id="wCount">3</b>
        <span data-i18n="win.cdPost"></span>
      </div>
    </div>
  </div>

  <div id="death" hidden>
    <div class="deadCard">
      <div class="dTitle" data-i18n="death.title"></div>
      <div class="dBy"><b id="dReason">—</b></div>
      <div class="dStats" id="dStats"></div>
      <div class="dCd">
        <span data-i18n="death.cdPre"></span> <b id="dCount">3</b>
        <span data-i18n="death.cdPost"></span>
      </div>
    </div>
  </div>
</div>

<!-- First visit from this address: the corner rules and keys, as a popup to read before playing -->
<div id="tutorial" hidden>
  <div class="tutCard">
    <div class="tTitle" data-i18n="tut.title"></div>
    <div class="rules">
      <div class="rHead" data-i18n="rules.head"></div>
      <div><b data-i18n="rules.goalK"></b><span data-i18n="rules.goalV"></span></div>
      <div><b data-i18n="rules.matchK"></b><span data-i18n-html="rules.matchV"></span></div>
      <div><b data-i18n="rules.bodyK"></b><span data-i18n="rules.bodyV"></span></div>
      <div><b data-i18n="rules.headK"></b><span data-i18n="rules.headV"></span></div>
      <div><b data-i18n="rules.selfK"></b><span data-i18n="rules.selfV"></span></div>
    </div>
    <div class="hint">
      <span data-i18n-html="hint.move"></span><br>
      <span data-i18n-html="hint.misc"></span>
    </div>
    <button id="tutOk" type="button" data-i18n="tut.ok"></button>
  </div>
</div>

<div id="login">
  <div class="panel">
    <div id="langSwitch">
      <button type="button" data-lang="zh" data-i18n="lang.zh"></button>
      <button type="button" data-lang="en" data-i18n="lang.en"></button>
    </div>
    <h1>Snake<span>Match3</span></h1>
    <p class="sub" data-i18n-html="login.sub"></p>
    <label class="field"><span data-i18n="login.nickname"></span>
      <input id="nickInput" maxlength="12" data-i18n-ph="login.nickPlaceholder" autocomplete="off">
      <div id="nickHint"></div>
    </label>
    <!-- Record of this address: standing, medal, what happened while away, next milestone -->
    <div class="field" id="record" hidden><span data-i18n="login.record"></span>
      <div id="recordList" class="record"></div>
    </div>
    <label class="field" id="titleField" hidden><span data-i18n="login.title"></span>
      <select id="titleSelect"></select>
    </label>
    <div class="field"><span data-i18n="login.skin"></span>
      <div id="skinList"></div>
    </div>
    <div class="field" id="hallField"><span data-i18n="login.hall"></span>
      <div id="hall" class="hall"></div>
    </div>
    <button id="playBtn" disabled data-i18n="login.connecting"></button>
    <p class="foot" id="loginFoot"></p>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
